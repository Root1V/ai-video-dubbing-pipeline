[project]
name = "video-translator"
version = "1.0.0"
description = "Traduccion de videos MP4 largos (EN -> ES) usando IA open source (Whisper, LLM local via Ollama, Coqui TTS)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Video Translator Team" }]

dependencies = [
    "faster-whisper>=1.0.3",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "tenacity>=8.3.0",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "structlog>=24.1.0",
    "ffmpeg-python>=0.2.0",
]

[project.optional-dependencies]
# Motor recomendado para doblaje (IndexTTS-2.5): control nativo de duracion,
# ideal para sincronizacion audiovisual. No esta en PyPI: se instala como
# dependencia de ruta local (ver [tool.uv.sources] abajo) apuntando al repo
# clonado en third_party/index-tts por ./scripts/setup_index_tts2.sh.
# IMPORTANTE: el clonado debe existir ANTES de correr "uv sync" o "uv lock"
# con este extra activo, o uv fallara al no encontrar la ruta. Por eso el
# script clona primero y recien despues corre "uv sync --extra dubbing-indextts".
dubbing-indextts = ["indextts", "huggingface-hub[cli]>=0.24.0"]

# Alternativa mas liviana de instalar (XTTS v2 via pip). No soporta Python >= 3.12.
dubbing-coqui = ["TTS>=0.22.0; python_version < '3.12'", "pydub>=0.25.1"]

dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.8",
]

[project.scripts]
video-translator = "video_translator.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
# "dubbing-coqui" (TTS==0.22.0, exige pandas<2.0/numpy<2.0) choca de version
# con "dubbing-indextts" (sus dependencias transitivas, p.ej. modelscope,
# exigen pandas/numpy >= 2.x). uv resuelve un lockfile universal que por
# defecto intenta satisfacer TODOS los extras a la vez, aunque no se instalen
# juntos; esto le dice que no hace falta una solucion conjunta. En la
# practica no se pierde nada: el motor de doblaje recomendado es
# "dubbing-indextts", no "dubbing-coqui".
#
# NOTA sobre diarizacion: pyannote.audio NO es un extra de este proyecto.
# Corre en un venv completamente aparte (./scripts/setup_diarization_env.sh),
# invocado por subprocess, porque tiene un conflicto de version de protobuf
# con IndexTTS-2.5 que no se puede resolver dentro de un mismo entorno
# (pyannote.audio exige protobuf>=5.0 via pyannoteai-sdk; IndexTTS-2.5 exige
# protobuf<3.20 via descript-audiotools). Ver infrastructure/diarization/.
conflicts = [
    [
        { extra = "dubbing-coqui" },
        { extra = "dubbing-indextts" },
    ],
]

[tool.uv.sources]
# "indextts" no esta en PyPI: se resuelve desde el clon local que hace
# ./scripts/setup_index_tts2.sh. Declararlo aqui (en vez de instalarlo con un
# "pip install -e" suelto) es lo que permite que sobreviva a futuros
# "uv sync": si no esta en el lockfile, uv lo desinstala en cada sync por
# considerarlo un paquete "extraño" al proyecto.
indextts = { path = "third_party/index-tts", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
