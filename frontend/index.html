<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prosodia</title>
    <script>
      // Aplica el tema antes de que React monte, para evitar un flash del
      // tema equivocado. Misma logica que src/lib/theme.ts (duplicada a
      // proposito: este script debe correr antes de que cargue el bundle).
      (function () {
        var stored = localStorage.getItem('prosodia-theme')
        var theme = stored === 'light' || stored === 'dark' ? stored : null
        if (!theme) {
          var hour = new Date().getHours()
          theme = hour >= 6 && hour < 18 ? 'light' : 'dark'
        }
        if (theme === 'dark') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
