server {
    listen 80;
    server_name _;

    # SPA: any path not matched below falls back to index.html so
    # client-side routing (react-router) handles it.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Same-origin /api calls from the SPA (see src/api/client.ts's relative
    # baseURL) are proxied to the "api" compose service. Docker's embedded
    # DNS (127.0.0.11) + a variable in proxy_pass forces nginx to resolve
    # "api" per-request instead of once at startup -- without this, nginx
    # refuses to start at all if the "api" container isn't up yet the
    # instant this one boots (a real startup-order race, not hypothetical).
    resolver 127.0.0.11 valid=30s;
    location /api/ {
        set $upstream_api api:8000;
        # No path after $upstream_api on purpose: with a variable in the
        # host, nginx does NOT do its usual "replace the matched location
        # prefix" rewrite -- a trailing "/api/" here would be taken
        # literally, collapsing every request to that fixed path (verified:
        # it forwarded "/api/auth/login" as bare "/api/"). Omitting the path
        # forwards the original request URI unchanged, which is exactly what
        # we want since FastAPI's own routes already live under "/api/...".
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
